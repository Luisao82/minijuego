<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/store/icons/favicon/favicon-16.png"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- Precarga de fuentes pixel art: las pide el navegador en paralelo a `index.html`
         para que estén disponibles antes de que Phaser pinte la primera escena.
         Sin esto, la primera carga del juego rasteriza los textos con la fuente
         fallback (`cursive` / `monospace` del sistema) y se queda así hasta navegar
         a otra escena. Phaser/canvas no redibuja al llegar la fuente — al contrario
         que el HTML normal. Combinado con `await document.fonts.ready` en main.js. -->
    <link rel="preload" href="/assets/fonts/jersey10.ttf" as="font" type="font/ttf" crossorigin />
    <link
      rel="preload"
      href="/assets/fonts/press-start-2p.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link rel="stylesheet" href="/style.css" />
    <title>La Cucaña Trianera</title>

    <!-- SEO básico -->
    <meta
      name="description"
      content="Minijuego que recrea una tradición muy popular de la Velá de Triana, La Cucaña. Coge impulso, mantén el equilibrio y alcanza la bandera."
    />
    <meta
      name="keywords"
      content="cucaña, triana, sevilla, minijuego, pixel art, velá de triana, juego retro"
    />
    <meta name="author" content="La Cucaña Trianera" />

    <!-- Open Graph — preview al compartir en WhatsApp, Twitter, Telegram... -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://minijuego-lilac.vercel.app/" />
    <meta property="og:title" content="La Cucaña Trianera" />
    <meta
      property="og:description"
      content="Minijuego que recrea una tradición muy popular de la Velá de Triana, La Cucaña. Coge impulso, mantén el equilibrio y alcanza la bandera."
    />
    <meta property="og:image" content="https://minijuego-lilac.vercel.app/assets/preview.webp" />
    <meta property="og:locale" content="es_ES" />

    <!-- Twitter/X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://minijuego-lilac.vercel.app/" />
    <meta name="twitter:title" content="La Cucaña Trianera" />
    <meta
      name="twitter:description"
      content="Minijuego que recrea una tradición muy popular de la Velá de Triana, La Cucaña. Coge impulso, mantén el equilibrio y alcanza la bandera."
    />
    <meta name="twitter:image" content="https://minijuego-lilac.vercel.app/assets/preview.webp" />

    <!-- Color de la barra del navegador en móvil -->
    <meta name="theme-color" content="#000000" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Cucaña" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/store/icons/ios/icon-180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/assets/store/icons/ios/icon-167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/assets/store/icons/ios/icon-152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/assets/store/icons/ios/icon-120.png" />
  </head>

  <body>
    <div id="app">
      <div
        id="game-container"
        role="application"
        aria-label="La Cucaña Trianera — minijuego pixel art. Usa los controles táctiles o el teclado para jugar."
      ></div>
    </div>
    <script type="module" src="src/main.js"></script>
    <script src="/register-sw.js"></script>
  </body>
</html>

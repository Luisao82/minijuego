<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Story · Actualización La Cucaña</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0b0f18;
        color: #eee;
        font-family: system-ui, sans-serif;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 24px;
      }
      canvas {
        width: 360px;
        height: 640px;
        image-rendering: pixelated;
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
        border-radius: 8px;
      }
      button {
        background: #e0a526;
        color: #1b1b2f;
        border: 4px solid #1b1b2f;
        padding: 12px 24px;
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
        border-radius: 4px;
      }
      button:hover {
        background: #f5bb3d;
      }
      p {
        opacity: 0.6;
        font-size: 13px;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <canvas id="c" width="1080" height="1920"></canvas>
      <button id="dl">Descargar PNG 1080×1920</button>
      <p id="status">Cargando…</p>
    </div>

    <script>
      const W = 1080,
        H = 1920
      const ORANGE = '#F26522',
        YELLOW = '#F5C542',
        GOLD = '#E0A526',
        DARK = '#141322',
        CREAM = '#F3E9D2'

      const ASSETS = {
        bg: 'assets/backgrounds/fondoIntro2.webp',
        logo: 'assets/ui/luisaoDev-logo.png',
      }
      const CHARS = ['rafi', 'fali', 'flamenca', 'abuela', 'guiri'].map(
        (n) => 'assets/sprites/characters/spritesheet/' + n + '.png'
      )

      function loadImg(src) {
        return new Promise((res, rej) => {
          const i = new Image()
          i.onload = () => res(i)
          i.onerror = () => rej(new Error('No se pudo cargar ' + src))
          i.src = src
        })
      }

      async function loadFonts() {
        const f1 = new FontFace('PressStart', "url('assets/fonts/press-start-2p.ttf')")
        const f2 = new FontFace('Jersey', "url('assets/fonts/jersey10.ttf')")
        const loaded = await Promise.all([f1.load(), f2.load()])
        loaded.forEach((f) => document.fonts.add(f))
      }

      // --- helpers -------------------------------------------------------------
      function px(ctx, size) {
        ctx.font = size + 'px PressStart'
      }
      function jr(ctx, size) {
        ctx.font = size + 'px Jersey'
      }

      // texto con sombra dura + contorno, estilo pixel
      function pixelText(ctx, txt, x, y, color, opts = {}) {
        const outline = opts.outline || DARK
        const shadow = opts.shadow !== undefined ? opts.shadow : 8
        const lw = opts.lw !== undefined ? opts.lw : 10
        ctx.textAlign = opts.align || 'center'
        ctx.textBaseline = 'alphabetic'
        ctx.lineJoin = 'round'
        ctx.miterLimit = 2
        if (shadow) {
          ctx.fillStyle = 'rgba(0,0,0,.55)'
          ctx.fillText(txt, x + shadow, y + shadow)
        }
        if (lw) {
          ctx.lineWidth = lw
          ctx.strokeStyle = outline
          ctx.strokeText(txt, x, y)
        }
        ctx.fillStyle = color
        ctx.fillText(txt, x, y)
      }

      function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath()
        ctx.moveTo(x + r, y)
        ctx.arcTo(x + w, y, x + w, y + h, r)
        ctx.arcTo(x + w, y + h, x, y + h, r)
        ctx.arcTo(x, y + h, x, y, r)
        ctx.arcTo(x, y, x + w, y, r)
        ctx.closePath()
      }

      // dibuja img cubriendo un rect (object-fit: cover)
      function drawCover(ctx, img, dx, dy, dw, dh, focusY = 0.5) {
        const s = Math.max(dw / img.width, dh / img.height)
        const sw = dw / s,
          sh = dh / s
        const sx = (img.width - sw) / 2
        const sy = (img.height - sh) * focusY
        ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh)
      }

      // --- render --------------------------------------------------------------
      async function render() {
        const ctx = document.getElementById('c').getContext('2d')
        const [bg, logo] = await Promise.all([loadImg(ASSETS.bg), loadImg(ASSETS.logo)])
        const chars = await Promise.all(CHARS.map(loadImg))

        ctx.imageSmoothingEnabled = false

        // 1. Fondo: la misma escena, desenfocada y oscurecida
        ctx.save()
        ctx.filter = 'blur(14px) brightness(0.42) saturate(1.25)'
        drawCover(ctx, bg, -30, -30, W + 60, H + 60, 0.5)
        ctx.restore()

        // capa de color para unificar
        let g = ctx.createLinearGradient(0, 0, 0, H)
        g.addColorStop(0, 'rgba(26,20,48,.72)')
        g.addColorStop(0.5, 'rgba(14,22,44,.55)')
        g.addColorStop(1, 'rgba(8,10,22,.92)')
        ctx.fillStyle = g
        ctx.fillRect(0, 0, W, H)

        // 2. Badge superior
        const bw = 620,
          bh = 78,
          bx = (W - bw) / 2,
          by = 150
        ctx.fillStyle = DARK
        roundRect(ctx, bx - 6, by - 6, bw + 12, bh + 12, 10)
        ctx.fill()
        ctx.fillStyle = GOLD
        roundRect(ctx, bx, by, bw, bh, 8)
        ctx.fill()
        ctx.fillStyle = 'rgba(255,255,255,.28)'
        ctx.fillRect(bx + 6, by + 6, bw - 12, 8)
        px(ctx, 26)
        pixelText(ctx, 'YA DISPONIBLE', W / 2, by + 52, DARK, { shadow: 0, lw: 0 })

        // 3. Título
        px(ctx, 92)
        pixelText(ctx, 'LA CUCAÑA', W / 2, 340, ORANGE, { lw: 14, shadow: 10 })
        px(ctx, 40)
        pixelText(ctx, 'de Triana', W / 2, 410, YELLOW, { lw: 9, shadow: 7 })

        // 4. Marco con la escena nítida
        const fy = 470,
          fh = 600
        ctx.save()
        ctx.fillStyle = DARK
        ctx.fillRect(0, fy - 14, W, fh + 28)
        ctx.fillStyle = GOLD
        ctx.fillRect(0, fy - 14, W, 8)
        ctx.fillRect(0, fy + fh + 6, W, 8)
        ctx.beginPath()
        ctx.rect(0, fy, W, fh)
        ctx.clip()
        drawCover(ctx, bg, 0, fy, W, fh, 0.45)
        // viñeta lateral
        const vg = ctx.createLinearGradient(0, 0, W, 0)
        vg.addColorStop(0, 'rgba(10,12,26,.55)')
        vg.addColorStop(0.25, 'rgba(0,0,0,0)')
        vg.addColorStop(0.75, 'rgba(0,0,0,0)')
        vg.addColorStop(1, 'rgba(10,12,26,.55)')
        ctx.fillStyle = vg
        ctx.fillRect(0, fy, W, fh)
        ctx.restore()

        // 5. Novedades
        const feats = [
          ['LAVADO DE CARA', 'Gráficos y efectos puestos a punto'],
          ['MÁS VIDA', 'Nuevas animaciones para el vecindario'],
          ['ALGO QUE CONTAR', 'Hay una historia esperándote arriba'],
        ]
        let y = 1200
        feats.forEach(([title, sub]) => {
          // bullet pixel
          ctx.fillStyle = DARK
          ctx.fillRect(112, y - 34, 34, 34)
          ctx.fillStyle = GOLD
          ctx.fillRect(118, y - 28, 22, 22)
          ctx.fillStyle = 'rgba(255,255,255,.4)'
          ctx.fillRect(118, y - 28, 22, 6)

          px(ctx, 31)
          pixelText(ctx, title, 176, y - 6, CREAM, { align: 'left', lw: 9, shadow: 6 })
          jr(ctx, 44)
          pixelText(ctx, sub, 178, y + 48, 'rgba(226,214,190,.92)', {
            align: 'left',
            lw: 6,
            shadow: 4,
          })
          y += 148
        })

        // 6. Fila de personajes sobre el suelo
        const S = 6,
          cw = 16 * S,
          ch = 24 * S
        const groundY = 1660
        ctx.fillStyle = 'rgba(0,0,0,.35)'
        ctx.fillRect(0, groundY, W, 26)
        ctx.fillStyle = GOLD
        ctx.fillRect(0, groundY, W, 5)

        const gap = 44
        const totalW = chars.length * cw + (chars.length - 1) * gap
        let cx = (W - totalW) / 2
        chars.forEach((img) => {
          // sombra bajo los pies
          ctx.fillStyle = 'rgba(0,0,0,.4)'
          ctx.beginPath()
          ctx.ellipse(cx + cw / 2, groundY + 2, cw * 0.38, 9, 0, 0, Math.PI * 2)
          ctx.fill()
          ctx.drawImage(img, 0, 0, 16, 24, Math.round(cx), Math.round(groundY - ch), cw, ch)
          cx += cw + gap
        })

        // 7. Firma
        const ls = Math.max(1, Math.round(58 / logo.height))
        const lw2 = logo.width * ls,
          lh2 = logo.height * ls
        ctx.drawImage(logo, Math.round((W - lw2) / 2), 1758, lw2, lh2)

        px(ctx, 22)
        pixelText(ctx, 'v1.10', W / 2, 1758 + lh2 + 46, 'rgba(230,220,200,.55)', {
          lw: 6,
          shadow: 0,
        })

        document.getElementById('status').textContent = 'Listo · 1080×1920'
      }

      document.getElementById('dl').onclick = () => {
        const a = document.createElement('a')
        a.download = 'cucana-story-v1.10.png'
        a.href = document.getElementById('c').toDataURL('image/png')
        a.click()
      }

      loadFonts()
        .then(render)
        .catch((e) => {
          document.getElementById('status').textContent = 'Error: ' + e.message
          console.error(e)
        })
    </script>
  </body>
</html>
